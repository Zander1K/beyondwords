[project]
name = "reading-companion-api"
version = "0.1.0"
description = "FastAPI backend for the Smart Glasses Reading Companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Settings from env vars (config.py). Pydantic v2 moved BaseSettings into this package.
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    # Async PostgreSQL driver for SQLAlchemy (fast, prebuilt wheels for macOS and Linux).
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Google's official Gemini SDK (image generation). docs/gemini.md.
    "google-genai>=3.3",
    # HTTP client for Nemotron (Verda vLLM) and Google Books / Open Library; also FastAPI's
    # async test client.
    "httpx>=0.27",
    # Dictionary syllable check and offline syllable fallback (brain/text_utils.py).
    "pyphen>=0.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Renders test page photos for eval/smoke_brain.py (dev only; the API does not use it).
    "pillow>=10.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
