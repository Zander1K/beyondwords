# Local dev stack: FastAPI + PostgreSQL. Mobile dev server runs separately (see README).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reading_companion}
      POSTGRES_USER: ${POSTGRES_USER:-reading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      # Inside compose the DB host is the service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-reading}:${POSTGRES_PASSWORD:-reading}@postgres:5432/${POSTGRES_DB:-reading_companion}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Live reload of API code and migrations during development.
      - ./apps/api/app:/srv/apps/api/app
      - ./db/migrations:/srv/db/migrations
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
